name: 홍이의 세계 뉴스 브리핑 자동 갱신

on:
  schedule:
    - cron: '50 22 * * *'  # 한국시간 매일 오전 7:50 (UTC 22:50)
  workflow_dispatch:        # 수동 실행 버튼도 추가

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: npm install node-fetch xml2js

      - name: 뉴스 수집 및 HTML 생성
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node update-news.js
